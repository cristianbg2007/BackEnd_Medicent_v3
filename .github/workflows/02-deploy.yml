# Pipeline 2: CI/CD a AWS EC2  (VERSIÓN 2: un job por etapa) -- RECOMENDADA
# Guárdalo en tu repositorio como .github/workflows/02-deploy.yml
#   Linter -> Unit Tests -> Integration Tests (MySQL real) -> Deploy
#
# Supone una app Flask con:
#   wsgi.py (expone `app`), requirements.txt,
#   tests/unit/, tests/integration/ y un endpoint GET /health
#
# Secrets: EC2_HOST, EC2_USER, EC2_SSH_KEY (en los environments staging/production)

name: 02 - CI/CD Deploy EC2

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  APP_DIR: /opt/flaskapp

jobs:
  # ---------------------------------------------------------------
  # Job 1: revisar el estilo del código.
  # Cada job corre en una máquina nueva: por eso todos empiezan
  # clonando el repositorio e instalando lo que necesitan.
  # ---------------------------------------------------------------
  lint:
    name: Linter
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar herramientas de estilo
        run: pip install flake8 black isort

      - name: Revisar formato con black
        run: black --check .

      - name: Revisar orden de imports con isort
        run: isort --check-only --profile black .

      - name: Revisar errores de estilo con flake8
        run: flake8 . --max-line-length=100 --exclude=venv

  # ---------------------------------------------------------------
  # Job 2: pruebas unitarias con SQLite en memoria.
  # ---------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest pytest-cov

      - name: Ejecutar pruebas unitarias
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: test
        run: pytest tests/unit --cov=. --cov-report=xml --junitxml=unit-results.xml

      - name: Guardar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            unit-results.xml
            coverage.xml

  # ---------------------------------------------------------------
  # Job 3: pruebas de integración contra un MySQL real y temporal.
  # ---------------------------------------------------------------
  integration-tests:
    name: Integration Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: app_test
          MYSQL_USER: app
          MYSQL_PASSWORD: app
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      DATABASE_URL: mysql+pymysql://app:app@127.0.0.1:3306/app_test
      SECRET_KEY: test
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest pytest-cov

      - name: Ejecutar pruebas de integración
        run: pytest tests/integration --junitxml=integration-results.xml

      - name: Guardar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: integration-results.xml

  # ---------------------------------------------------------------
  # Job E2E (DESACTIVADO): pruebas de punta a punta.
  # Levanta la app con Gunicorn en la máquina de GitHub, con un MySQL
  # temporal, y ejecuta tests/e2e contra http://127.0.0.1:8000
  # (la URL llega a las pruebas en la variable BASE_URL).
  #
  # Para activarlo cuando tengas pruebas en tests/e2e:
  #   1. Quita el "# " del inicio de cada línea de este job.
  #   2. En el job deploy, cambia "needs: integration-tests"
  #      por "needs: e2e-tests" (está indicado allí).
  #   3. Si tus pruebas usan otras librerías (por ejemplo playwright),
  #      agrégalas en el paso "Instalar dependencias".
  # ---------------------------------------------------------------
