        # run: |
          # gunicorn wsgi:app --bind 127.0.0.1:8000 --daemon
          # for i in 1 2 3 4 5 6; do
            # sleep 5
            # curl -fsS "$BASE_URL/health" && exit 0
          # done
          # echo "La app no respondió en /health"
          # exit 1
#
      # - name: Ejecutar pruebas E2E
        # run: pytest tests/e2e --junitxml=e2e-results.xml
#
      # - name: Guardar reportes de pruebas
        # if: always()
        # uses: actions/upload-artifact@v4
        # with:
          # name: e2e-test-results
          # path: e2e-results.xml

  # ---------------------------------------------------------------
  # Job 4: desplegar en el servidor (staging o production).
  # No corre en pull requests.
  # ---------------------------------------------------------------
  deploy:
    name: Deploy
    needs: integration-tests
    # needs: e2e-tests        # <- usa esta línea en lugar de la anterior al activar E2E
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Preparar carpeta de releases
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ env.APP_DIR }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: APP_DIR
          script: |
            set -euo pipefail
            mkdir -p "$APP_DIR/releases"

      - name: Subir código a la carpeta de release
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -az --delete --exclude=.git --exclude=.github --exclude=tests --exclude=venv
          path: ./
          remote_path: ${{ env.APP_DIR }}/releases/${{ github.sha }}/
          remote_host: ${{ secrets.EC2_HOST }}
          remote_user: ${{ secrets.EC2_USER }}
          remote_key: ${{ secrets.EC2_SSH_KEY }}

      - name: Instalar dependencias, activar release y verificar
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ env.APP_DIR }}
          SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: APP_DIR,SHA
          script: |
            set -euo pipefail
            REL="$APP_DIR/releases/$SHA"

            # 1. Dependencias en el entorno virtual del servidor (como el usuario dueño del venv)
            sudo -u flaskapp "$APP_DIR/venv/bin/pip" install -q -r "$REL/requirements.txt"

            # 2. Recordar la release activa, para poder volver a ella
            PREV=""
            if [ -L "$APP_DIR/app" ]; then
              PREV=$(readlink -f "$APP_DIR/app")
            else
              sudo rm -rf "$APP_DIR/app"   # primera vez: era una carpeta vacía
            fi

            # 3. Activar la release nueva y reiniciar Gunicorn
            ln -sfn "$REL" "$APP_DIR/app"
            sudo systemctl restart flaskapp

            # 4. Health check: hasta 6 intentos, 5 segundos entre cada uno
            for i in 1 2 3 4 5 6; do
              sleep 5
              if curl -fsS http://localhost/health; then
                echo
                echo "Release $SHA activa"
                # Conservar solo las 5 últimas releases
                ls -1dt "$APP_DIR"/releases/* | tail -n +6 | xargs -r rm -rf
                exit 0
              fi
            done

            # 5. Rollback: volver a la release anterior
            echo "Health check falló -> rollback a ${PREV:-ninguna}"
            if [ -n "$PREV" ] && [ "$PREV" != "$REL" ]; then
              ln -sfn "$PREV" "$APP_DIR/app"
              sudo systemctl restart flaskapp
            fi
            exit 1